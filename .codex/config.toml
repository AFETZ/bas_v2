# Project-local Codex settings for the network/radio long-run workflow.
# The VS Code extension and Codex CLI share Codex configuration, so these
# settings apply when this trusted project is opened from either surface.

project_doc_max_bytes = 65536

[features]
goals = true
hooks = true

[agents]
max_threads = 8
max_depth = 1
job_max_runtime_seconds = 14400
