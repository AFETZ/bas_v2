# Five-UAV product scenario in the canonical CAVISE Town01 scene frame.
schema_version: 1

scenario:
  name: scenario_5uav_town01
  description: Five live ArduPilot/Gazebo UAVs using the official CAVISE Town01 geometry.
  map:
    town: Town01
    world_file: .external/cavise_maps/Town01/gazebo/town01.sdf
    scene_xml: .external/cavise_maps/Town01/map/scene.xml
    gazebo_models: [cavise_town01]
    bounds_m:
      xmin: -1577.708829814624
      ymin: -1474.8671726619064
      xmax: 1613.447172459159
      ymax: 1716.2871790967324
    size_m: [3191.156002273783, 3191.1543517586388]
    customer_10x10_requirement_met: false

