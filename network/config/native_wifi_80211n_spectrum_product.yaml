# Authoritative native Wi-Fi/Sionna product-radio configuration.
schema_version: 1

radio:
  backend: wifi
  profile: native_wifi_80211n_spectrum_reference_v1
  technology_specific_modem: true
  standard: 802.11n
  ssid: bas-native-radio
  carrier_hz: 2400000000
  channel_width_mhz: 20
  data_mode: HtMcs0
  control_mode: HtMcs0
  tx_power_w: 0.01
  legacy_aloha_phy_rate_bps: 1000000
  shared_spectrum_channels: 1
  neighbor_discovery_mode: preconfigured_static_neighbors
  reason: deterministic_external_endpoint_arp
  packet_outcome_affected: false

sionna:
  solver_profile: realtime_minimal_solver_profile
  max_depth: 1
  los: true
  specular_reflection: true
  diffuse_reflection: false
  diffraction: false
  edge_diffraction: false
  refraction: false
  synthetic_array: true
  seed: 42
  max_number_of_paths: 90
  cache_expiry_jitter_fraction: 0.5
  channel_state_max_age_s: 20.0
  endpoint_displacement_threshold_m: 10.0
  readiness_lag_max_ms: 50.0
  readiness_consecutive_samples: 3
