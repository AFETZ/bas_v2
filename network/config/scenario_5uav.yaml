# Launch-compatible scenario file for the existing multiagent_simulation launch.
# The upstream launch file reads the top-level `robots` list and ignores the
# additional network metadata below.
schema_version: 1

scenario:
  name: scenario_5uav
  description: Five UAVs plus one command post for packet-in-the-loop network/radio integration.
  map:
    world_file: modelflughafen/model.sdf
    # Bounds come from the checked-in heightmap/Collada asset, not from the
    # future long-range customer-scene target.
    bounds_m: {xmin: -50.0, ymin: -100.0, xmax: 150.0, ymax: 50.0}
    size_m: [200, 150]
    terrain_height_variation_m: 9.3
    long_range_scene_eligible: false

base_simulation:
  launch_package: multiagent_simulation
  launch_file: multiagent_simulation.launch.py
  sitl_home: "46.607213,14.278461,446,10"
  recommended_launch_arguments:
    gui: false
    rviz: false
    use_mapping_camera: false
    use_navigation_camera: false
    use_zed_camera: false
    robots_config_file: network/config/scenario_5uav.yaml

command_post:
  id: cp
  role: command_post
  gazebo_model_name: command_post
  # Interpolated from modelflughafen.dae at x=0, y=0.  This is a local ENU
  # surface elevation, not the 446 m WGS84 altitude used by SITL home.
  position_m: [0.0, 0.0, -0.2662]
  orientation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
  antenna: omni

robots:
  - name: uav1
    role: uav
    instance: 0
    system_id: 1
    dds_udp_port: 2019
    master_tcp_port: 5760
    sitl_udp_port: 5501
    fdm_udp_port: 9002
    mavproxy_out: 127.0.0.1:14601
    position: [0.0, -40.0, 2.0, 0.0, 0.0, 0.0]
    nominal_radio_position_m: [0.0, -40.0, 2.0]
    antenna: omni
  - name: uav2
    role: uav
    instance: 1
    system_id: 2
    dds_udp_port: 2020
    master_tcp_port: 5770
    sitl_udp_port: 5511
    fdm_udp_port: 9012
    mavproxy_out: 127.0.0.1:14602
    position: [20.0, -40.0, 2.0, 0.0, 0.0, 0.0]
    nominal_radio_position_m: [20.0, -40.0, 2.0]
    antenna: omni
  - name: uav3
    role: uav
    instance: 2
    system_id: 3
    dds_udp_port: 2021
    master_tcp_port: 5780
    sitl_udp_port: 5521
    fdm_udp_port: 9022
    mavproxy_out: 127.0.0.1:14603
    position: [40.0, -40.0, 2.0, 0.0, 0.0, 0.0]
    nominal_radio_position_m: [40.0, -40.0, 2.0]
    antenna: omni
  - name: uav4
    role: uav
    instance: 3
    system_id: 4
    dds_udp_port: 2022
    master_tcp_port: 5790
    sitl_udp_port: 5531
    fdm_udp_port: 9032
    mavproxy_out: 127.0.0.1:14604
    position: [60.0, -40.0, 2.0, 0.0, 0.0, 0.0]
    nominal_radio_position_m: [60.0, -40.0, 2.0]
    antenna: omni
  - name: uav5
    role: uav
    instance: 4
    system_id: 5
    dds_udp_port: 2023
    master_tcp_port: 5800
    sitl_udp_port: 5541
    fdm_udp_port: 9042
    mavproxy_out: 127.0.0.1:14605
    position: [80.0, -40.0, 2.0, 0.0, 0.0, 0.0]
    nominal_radio_position_m: [80.0, -40.0, 2.0]
    antenna: omni

radio:
  carrier_hz: 2400000000
  bandwidth_hz: 20000000
  tx_power_dbm_default: 33.0
  tx_power_w_range: [1.0, 2.0]
  service_tiers_file: network/config/service_tiers.yaml

traffic_classes:
  - control
  - payload
  - additional_data
